[package]
name = "xcron-keeper"
version = "0.1.0"
edition = "2021"
description = "XCron Protocol — Shard-native keeper bot in Rust/Tokio"
authors = ["XCron Protocol"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket client
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"

# HTTP client (for API queries + tx broadcast)
reqwest = { version = "0.12", features = ["json", "native-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto (Ed25519 signing)
ed25519-dalek = { version = "2", features = ["pem"] }
sha2 = "0.10"
hex = "0.4"
bech32 = "0.11"
base64 = "0.22"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
