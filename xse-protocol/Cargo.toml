[package]
name = "xse-protocol"
version = "0.1.0"
edition = "2024"

[lib]
name = "xse_protocol"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.133"
tokio = { version = "1.41.0", features = ["full"] }
rsa = "0.9.6"
rand = "0.8.5"
reqwest = { version = "0.12.9", features = ["json"] }
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"
base64 = "0.22.1"
ed25519-dalek = "2.1.1"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
clap = { version = "4.5.4", features = ["derive"] }
chrono = "0.4.38"
pqcrypto-dilithium = "0.5.0"
pqcrypto-traits = "0.3.5"

# ── PRODUCTION CRYPTOGRAPHIC INTEGRATIONS ──────────────────────────────────
# VDF: Class Groups of Imaginary Quadratic Fields (same as Chia Network's VDF)
# Eliminates trusted setup requirement and supports discriminants > 2^1024
classgroup = "0.1.0"

# BabyJubjub: Twisted Edwards curve native over BN254 scalar field (254-bit)
# Replaces the portable 127-bit Mersenne simulator
ark-ed-on-bn254 = "0.4.0"
ark-ff = "0.4.0"
ark-ec = "0.4.0"
ark-serialize = "0.4.0"

# AWS Nitro Enclave NSM: Real CBOR/COSE attestation document parser
# Only functional inside an actual Nitro Enclave EC2 instance
aws-nitro-enclaves-nsm-api = { version = "0.4.0", optional = true }

[features]
default = []
# Enable only when compiling inside an AWS Nitro Enclave
nitro-enclave = ["aws-nitro-enclaves-nsm-api"]
