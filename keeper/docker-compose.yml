version: "3.8"

services:
  xcron-keeper:
    build: .
    container_name: xcron-keeper
    restart: unless-stopped
    volumes:
      # Mount your config directory with keeper-config.json and PEM file
      - ./config:/app/config:ro
    environment:
      - KEEPER_CONFIG=/app/config/keeper-config.json
      - NODE_ENV=production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits to prevent runaway processes
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
